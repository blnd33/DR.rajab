; /etc/supervisor/conf.d/orthotrack-test-horizon.conf — queue worker of the TEST SITE only
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start orthotrack-test-horizon
[program:orthotrack-test-horizon]
process_name=%(program_name)s
command=php /var/www/orthotrack-test/artisan horizon
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/orthotrack-test/storage/logs/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
