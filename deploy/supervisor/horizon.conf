; /etc/supervisor/conf.d/orthotrack-horizon.conf
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start orthotrack-horizon
[program:orthotrack-horizon]
process_name=%(program_name)s
command=php /var/www/orthotrack/artisan horizon
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/orthotrack/storage/logs/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
